# Hardened Kernel Parameters (sysctl)
# Generated by Linux Hardening Suite
# Apply: sudo sysctl -p config/sysctl.conf

# --- Network Security ---
# Disable IP forwarding (enable only if this is a router)
net.ipv4.ip_forward = 0
net.ipv6.conf.all.forwarding = 0

# Disable ICMP redirects
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# Disable source routing
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

# Enable SYN cookies (SYN flood protection)
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_max_syn_backlog = 2048
net.ipv4.tcp_synack_retries = 2
net.ipv4.tcp_syn_retries = 5

# Log Martian packets
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1

# Ignore ICMP broadcast requests
net.ipv4.icmp_echo_ignore_broadcasts = 1

# Ignore bogus ICMP error responses
net.ipv4.icmp_ignore_bogus_error_responses = 1

# Enable reverse path filtering
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Reduce TCP FIN timeout
net.ipv4.tcp_fin_timeout = 15

# Reduce TIME_WAIT
net.ipv4.tcp_tw_reuse = 1

# Disable IPv6 if not needed (uncomment if required)
# net.ipv6.conf.all.disable_ipv6 = 1
# net.ipv6.conf.default.disable_ipv6 = 1

# --- Memory Protection ---
# Restrict dmesg access
kernel.dmesg_restrict = 1

# Restrict kernel pointer leaks
kernel.kptr_restrict = 2

# Enable ASLR (Address Space Layout Randomization)
kernel.randomize_va_space = 2

# Restrict ptrace scope
kernel.yama.ptrace_scope = 1

# Restrict perf_event access
kernel.perf_event_paranoid = 3

# Disable SysRq key (emergency keyboard shortcuts)
kernel.sysrq = 0

# Restrict unprivileged BPF
kernel.unprivileged_bpf_disabled = 1

# Disable userfaultfd for unprivileged users
vm.unprivileged_userfaultfd = 0

# --- File System ---
# Restrict access to dmesg
fs.suid_dumpable = 0

# Harden BPF
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2

# Restrict hardlink/symlink creation
fs.protected_hardlinks = 1
fs.protected_symlinks = 1

# Restrict FIFO/regular file writes in world-writable dirs
fs.protected_fifos = 2
fs.protected_regular = 2

# --- Connection Tracking ---
# Increase conntrack table size for busy servers
net.netfilter.nf_conntrack_max = 1048576

# --- IPv6 Privacy Extensions ---
# Enable temporary IPv6 addresses
net.ipv6.conf.all.use_tempaddr = 2
net.ipv6.conf.default.use_tempaddr = 2
