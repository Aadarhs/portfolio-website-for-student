name = "cybersecurity-portfolio"
type = "javascript"
account_id = ""
workers_dev = true
main = "dist/index.js"
site = { bucket = ".next/static" }
build = { command = "npm run build", cwd = "./", watch_paths = ["src/**/*.ts"] }

# Cloudflare Pages configuration
pages_build_output_dir = ".next"

# Environment variables
[env.production]
name = "cybersecurity-portfolio-prod"

[env.staging]
name = "cybersecurity-portfolio-staging"

# Bindings configuration
[env.production.bindings]
# Add your Cloudflare bindings here
# Examples:
# database = { binding = "D1", database_id = "your-database-id" }
# kv = { binding = "KV", id = "your-kv-namespace-id" }

# Routes configuration
[[routes]]
pattern = "api/*"
zone_id = ""

# Triggers (cron jobs)
[[triggers.crons]]
cron = "0 0 * * *"
handler = "scheduled"
